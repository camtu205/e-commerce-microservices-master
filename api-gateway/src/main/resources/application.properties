# Server
server.port=8900
spring.application.name=api-gateway



# GLOBAL CORS CONFIG
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# DEDUPLICATE CORS HEADERS
# This ensures that if both the Gateway and a Microservice add CORS headers,
# the browser only receives one, avoiding the "multiple values" error.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka

# Redis & Session (Dùng chung namespace 'session' để đồng bộ với Order Service)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.store-type=none
spring.session.redis.namespace=session

# GATEWAY ROUTES (Thay thế Zuul)
# ----------------------------------

# 1. User Service: /api/accounts/** -> user-service: /accounts/**
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:lb://user-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 2. Catalog Service: /api/catalog/** -> product-catalog-service: /catalog/**
spring.cloud.gateway.routes[1].id=product-catalog-service
spring.cloud.gateway.routes[1].uri=${CATALOG_SERVICE_URL:lb://product-catalog-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

# 3. Order Service: /api/shop/** -> order-service: /shop/**
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=${ORDER_SERVICE_URL:lb://order-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shop/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# 4. Brand Service: /api/brand/** -> brand-service: /brand/**
spring.cloud.gateway.routes[3].id=brand-service
spring.cloud.gateway.routes[3].uri=${BRAND_SERVICE_URL:lb://brand-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/brand/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

# 5. Recommendation Service: /api/review/** -> product-recommendation-service: /review/**
spring.cloud.gateway.routes[4].id=product-recommendation-service
spring.cloud.gateway.routes[4].uri=${RECOMMENDATION_SERVICE_URL:lb://product-recommendation-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/review/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

# 6. Chat Service: /api/chat/** -> chat-service: /chat/**
spring.cloud.gateway.routes[5].id=chat-service
spring.cloud.gateway.routes[5].uri=${CHAT_SERVICE_URL:lb://chat-service}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/chat/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# 7. WebSocket Chat: /ws-chat/** -> chat-service: /ws-chat/**
spring.cloud.gateway.routes[6].id=chat-websocket
spring.cloud.gateway.routes[6].uri=${CHAT_WS_URL:lb://chat-service}
spring.cloud.gateway.routes[6].predicates[0]=Path=/ws-chat/**

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
# Dòng này để Gateway nhìn thấy hostname thay vì tên máy tính
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# Gateway Timeouts to prevent 503 on slow/swapped-out services
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30s

# Tăng giới hạn kích thước request cho Gateway (Mặc định thường thấp)
# Lưu ý: Cấu hình này áp dụng cho Spring Cloud Gateway (WebFlux/Netty)
spring.codec.max-in-memory-size=50MB