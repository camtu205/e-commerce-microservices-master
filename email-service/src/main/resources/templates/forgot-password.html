<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 500px; margin: 0 auto; padding: 30px; border: 1px solid #eee; border-radius: 12px; text-align: center; }
        .header h1 { color: #f9a8d4; }
        .otp-box { background: #fdf2f8; color: #db2777; font-size: 2.5rem; font-weight: bold; letter-spacing: 10px; padding: 20px; border-radius: 8px; margin: 25px 0; border: 1px dashed #f9a8d4; }
        .instruction { font-size: 0.95rem; color: #666; margin-bottom: 20px; }
        .footer { font-size: 0.8rem; color: #999; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Khôi phục mật khẩu</h1>
        </div>
        
        <p class="instruction">Bạn đã yêu cầu đặt lại mật khẩu cho tài khoản CTUS LUX Heritage. Vui lòng sử dụng mã OTP dưới đây:</p>

        <div class="otp-box" th:text="${otp}">123456</div>

        <p class="instruction">Mã này sẽ hết hạn sau <strong>15 phút</strong>. Nếu bạn không yêu cầu thay đổi này, hãy bỏ qua email này.</p>

        <div class="footer">
            <p>&copy; 2026 CTUS LUX Heritage. Trân trọng.</p>
        </div>
    </div>
</body>
</html>
