##### Service details: #####
server.port= 8811
spring.application.name=user-service
server.url= http://localhost:8811

#Client registration properties :
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka

#Data source (Đổi sang MySQL) :
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Jpa/Hibernate (Đổi Dialect sang MySQL) :
spring.jpa.show-sql=true
# Dùng bản này cho MySQL 8 (XAMPP/Docker)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Thêm dòng này để Hibernate không tự ý đổi tên bảng
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

##### HTTP #####
error.404.schema.details=The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable
error.406.schema.details=This request is not acceptable. Supported MIME types are application/json

# Ép service đăng ký bằng IP thay vì hostname
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Error details
server.error.include-message=always
server.error.include-binding-errors=always