#Server port :
server.port= 8812

#Application name :
spring.application.name=product-recommendation-service

#Client registration properties
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka

#Data source
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/product_recommendations}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver


#Jpa/Hibernate (Đã đổi sang PostgreSQL) :
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Ép service đăng ký bằng IP thay vì hostname
eureka.instance.prefer-ip-address=true
# Định dạng lại ID hiển thị trên Eureka để chắc chắn nó dùng IP
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Sửa lại Dialect cho đúng PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect