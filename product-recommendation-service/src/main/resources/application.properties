#Server port :
server.port= 8812

#Application name :
spring.application.name=product-recommendation-service

#Client registration properties
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka

#Data source
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/product_recommendations}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver


#Jpa/Hibernate (Đã đổi sang PostgreSQL) :
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
# Định dạng lại ID hiển thị trên Eureka để chắc chắn nó dùng Hostname
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# Sửa lại Dialect cho đúng PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect