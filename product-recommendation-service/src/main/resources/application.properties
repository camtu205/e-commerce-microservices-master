#Server port :
server.port= 8812

#Application name :
spring.application.name=product-recommendation-service

#Client registration properties
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka

#Data source
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/product_recommendations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver


#Jpa/Hibernate (Đã đổi sang MySQL) :
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Ép service đăng ký bằng IP thay vì hostname
eureka.instance.prefer-ip-address=true
# Định dạng lại ID hiển thị trên Eureka để chắc chắn nó dùng IP
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Sửa lại Dialect cho đúng bản MySQL 8 (XAMPP mới)
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect